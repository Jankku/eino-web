      type="font/woff2"
      crossorigin
    />
    <script>
      (function () {
        var mode = "dark";
        try {
          mode = localStorage.getItem("mui-mode") || "dark";
        } catch (e) {}
        if (mode === "system") {
          mode = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        document.documentElement.classList.add(
          mode === "light" ? "light" : "dark",
        );
      })();
    </script>
    <style>
      html.dark {
        color-scheme: dark;
        background-color: #191b21;
      }
      html.light {
        color-scheme: light;
        background-color: #edf8ff;
      }
    </style>
    <script
      defer
      data-domain="eino.jankku.fi"
      src="https://analytics.jankku.fi/js/script.exclusions.outbound-links.js"
      data-exclude="/books/*, /movies/*"
    ></script>
  </head>

  <body>

    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
